name: Feature request
description: Suggest something to add or change
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: Describe the feature. If it exists in Arc or another browser, say which and how it works there.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you want it?
      description: What are you trying to do that you can't do now?
    validations:
      required: false
  - type: input
    id: firefox
    attributes:
      label: Firefox version and system
      placeholder: "Firefox 157, macOS 26"
    validations:
      required: false
